<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>EcoPredict｜微型氣候與洪災預測網</title>
  <meta name="description" content="EcoPredict — 社區級洪災與土石流即時風險監測預測系統" />

  <!-- Leaflet.js -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <!-- EcoPredict API 設定（必須在所有應用 JS 之前載入） -->
  <script src="config.js"></script>

  <style>
    /* ── CSS 變數 ─────────────────────────────────────── */
    :root {
      --bg:        #0b1120;
      --surface:   #111827;
      --surface2:  #1f2937;
      --border:    rgba(255,255,255,0.08);
      --text:      #f1f5f9;
      --muted:     #94a3b8;
      --accent:    #38bdf8;

      --c-low:      #22c55e;
      --c-medium:   #eab308;
      --c-high:     #f97316;
      --c-critical: #ef4444;

      --sidebar-w: 340px;
      --header-h:  58px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 標題列 ───────────────────────────────────────── */
    header {
      height: var(--header-h);
      flex-shrink: 0;
      background: linear-gradient(90deg, #0b1120 0%, #0f2440 60%, #0b1120 100%);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.25rem;
      gap: 0.75rem;
      z-index: 1000;
    }

    .logo-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #22c55e, #38bdf8);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; flex-shrink: 0;
    }

    header h1 {
      font-size: 1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #f1f5f9, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      white-space: nowrap;
    }

    .header-stats {
      margin-left: auto;
      display: flex;
      gap: 0.5rem;
      flex-wrap: nowrap;
    }

    .stat-chip {
      display: flex; align-items: center; gap: 5px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot-critical { background: var(--c-critical); box-shadow: 0 0 6px var(--c-critical); }
    .dot-high     { background: var(--c-high); }
    .dot-medium   { background: var(--c-medium); }
    .dot-low      { background: var(--c-low); }

    /* ── 主體佈局 ─────────────────────────────────────── */
    main {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* ── 地圖 ─────────────────────────────────────────── */
    #map {
      flex: 1;
      min-width: 0;
      background: #0b1120;
    }

    /* Leaflet 黑色主題覆蓋 */
    .leaflet-container { background: #0f172a !important; }
    .leaflet-popup-content-wrapper {
      background: #1e293b !important;
      border: 1px solid rgba(56,189,248,0.25) !important;
      border-radius: 14px !important;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6) !important;
      color: var(--text) !important;
      padding: 0 !important;
      min-width: 280px;
      max-width: 320px;
    }
    .leaflet-popup-tip { background: #1e293b !important; }
    .leaflet-popup-content { margin: 0 !important; padding: 0 !important; width: auto !important; }
    .leaflet-popup-close-button { color: var(--muted) !important; font-size: 18px !important; top: 10px !important; right: 12px !important; }

    /* ── 彈窗卡片 ─────────────────────────────────────── */
    .popup-card { padding: 1rem 1.1rem 1rem; }

    .popup-header {
      display: flex; align-items: flex-start; gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .risk-badge {
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .badge-LOW      { background: rgba(34,197,94,0.15); color: var(--c-low); border: 1px solid var(--c-low); }
    .badge-MEDIUM   { background: rgba(234,179,8,0.15);  color: var(--c-medium); border: 1px solid var(--c-medium); }
    .badge-HIGH     { background: rgba(249,115,22,0.15); color: var(--c-high); border: 1px solid var(--c-high); }
    .badge-CRITICAL { background: rgba(239,68,68,0.15);  color: var(--c-critical); border: 1px solid var(--c-critical); }

    .popup-name { font-size: 1rem; font-weight: 700; line-height: 1.3; }
    .popup-sub  { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }

    .popup-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }
    .metric-box {
      background: rgba(255,255,255,0.04);
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }
    .metric-val { font-size: 1rem; font-weight: 700; }
    .metric-lbl { font-size: 0.62rem; color: var(--muted); margin-top: 1px; }

    .chart-wrap { position: relative; height: 110px; margin-bottom: 0.5rem; }
    .chart-title { font-size: 0.68rem; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }

    .popup-footer {
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
      padding-top: 0.6rem;
      font-size: 0.72rem;
      color: var(--muted);
    }
    .care-badge {
      background: rgba(56,189,248,0.1);
      border: 1px solid rgba(56,189,248,0.3);
      border-radius: 10px;
      padding: 2px 8px;
      color: var(--accent);
      font-weight: 600;
    }
    .score-bar-wrap { display: flex; align-items: center; gap: 6px; }
    .score-bar { width: 60px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
    .score-bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }

    /* ── 側邊欄 ───────────────────────────────────────── */
    #sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: rgba(17,24,39,0.96);
      backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .sidebar-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-header h2 {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--c-critical);
      display: flex; align-items: center; gap: 0.5rem;
    }
    .pulse-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--c-critical);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
      50%       { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
    }
    .sidebar-count {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .alert-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.75rem;
    }
    .alert-list::-webkit-scrollbar { width: 4px; }
    .alert-list::-webkit-scrollbar-track { background: transparent; }
    .alert-list::-webkit-scrollbar-thumb { background: var(--surface2); border-radius: 2px; }

    .alert-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid transparent;
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .alert-item:hover {
      background: var(--surface2);
      transform: translateX(-2px);
    }
    .alert-item.level-CRITICAL { border-left-color: var(--c-critical); }
    .alert-item.level-HIGH     { border-left-color: var(--c-high); }

    .alert-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
    .alert-name { font-size: 0.82rem; font-weight: 600; }
    .alert-score {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
    }
    .score-critical { background: rgba(239,68,68,0.15); color: var(--c-critical); }
    .score-high     { background: rgba(249,115,22,0.15); color: var(--c-high); }
    .alert-meta { font-size: 0.7rem; color: var(--muted); }
    .alert-rain { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
      font-size: 0.82rem;
    }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }

    /* ── 手機浮動按鈕 ─────────────────────────────────── */
    #fab-alert {
      display: none;
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 2000;
      background: var(--c-critical);
      color: white;
      border: none;
      border-radius: 50%;
      width: 56px; height: 56px;
      font-size: 1.4rem;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(239,68,68,0.5);
      animation: pulse 2s infinite;
    }

    /* ── 手機側邊欄 overlay ───────────────────────────── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 1500;
    }

    /* ── 載入指示器 ───────────────────────────────────── */
    #loading {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 1rem;
      z-index: 9999;
      transition: opacity 0.4s;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: var(--muted); font-size: 0.85rem; }

    /* ── 響應式 ───────────────────────────────────────── */
    @media (max-width: 768px) {
      :root { --sidebar-w: 100%; }
      header h1 { font-size: 0.85rem; }
      .header-stats { display: none; }

      #sidebar {
        position: fixed;
        top: var(--header-h);
        right: 0;
        bottom: 0;
        width: min(380px, 92vw);
        transform: translateX(100%);
        z-index: 1600;
        border-left: 1px solid var(--border);
      }
      #sidebar.open { transform: translateX(0); }

      #fab-alert { display: flex; align-items: center; justify-content: center; }
      #overlay.visible { display: block; }
      .popup-card { min-width: 240px; }
    }
  </style>
</head>
<body>

<!-- 載入指示器 -->
<div id="loading">
  <div class="spinner"></div>
  <p>EcoPredict 載入中…</p>
</div>

<!-- 標題列 -->
<header>
  <div class="logo-icon">🌊</div>
  <h1>EcoPredict｜微型氣候與洪災預測網</h1>
  <div class="header-stats" id="header-stats">
    <div class="stat-chip"><span class="dot dot-critical"></span><span id="cnt-critical">0</span> 極高風險</div>
    <div class="stat-chip"><span class="dot dot-high"></span><span id="cnt-high">0</span> 高風險</div>
    <div class="stat-chip"><span class="dot dot-medium"></span><span id="cnt-medium">0</span> 中風險</div>
  </div>
</header>

<main>
  <!-- 地圖 -->
  <div id="map"></div>

  <!-- 側邊欄 -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <h2><span class="pulse-dot"></span>即時告警清單</h2>
      <div class="sidebar-count" id="sidebar-count">載入中…</div>
    </div>
    <div class="alert-list" id="alert-list">
      <div class="empty-state"><div class="empty-icon">⏳</div>載入中…</div>
    </div>
  </aside>
</main>

<!-- 手機 FAB 按鈕 -->
<button id="fab-alert" aria-label="開啟告警清單">🚨</button>
<div id="overlay"></div>

<script>
// ── 常數 ──────────────────────────────────────────────────
// API_BASE 由 config.js 注入的 window.ECOPREDICT_API 決定
// 本地開發 → http://127.0.0.1:8000
// Cloudflare Pages → https://ecopredict-api.onrender.com
const API_BASE = (typeof window.ECOPREDICT_API !== 'undefined')
  ? window.ECOPREDICT_API
  : 'http://127.0.0.1:8000';  // fallback
const RISK_COLORS = {
  LOW:      '#22c55e',
  MEDIUM:   '#eab308',
  HIGH:     '#f97316',
  CRITICAL: '#ef4444',
};
const RISK_RADIUS = { LOW: 5, MEDIUM: 6, HIGH: 8, CRITICAL: 9 };

let map, popupChart = null;

// ── Leaflet 地圖初始化 ─────────────────────────────────────
function initMap() {
  map = L.map('map', {
    center: [23.8, 121.0],
    zoom: 8,
    zoomControl: true,
    attributionControl: true,
  });

  // 深色地圖圖磚（CartoDB Dark Matter）
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/">OSM</a> © <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 19,
  }).addTo(map);
}

// ── 顏色與樣式工具 ────────────────────────────────────────
function riskColor(level) { return RISK_COLORS[level] || '#94a3b8'; }
function riskRadius(level) { return RISK_RADIUS[level] || 5; }

function makeCircleMarker(feature) {
  const { risk_level } = feature.properties;
  return L.circleMarker(
    [feature.geometry.coordinates[1], feature.geometry.coordinates[0]],
    {
      radius:      riskRadius(risk_level),
      fillColor:   riskColor(risk_level),
      color:       risk_level === 'CRITICAL' ? '#fff' : riskColor(risk_level),
      weight:      risk_level === 'CRITICAL' ? 1.5 : 0.5,
      opacity:     1,
      fillOpacity: risk_level === 'LOW' ? 0.55 : 0.85,
    }
  );
}

// ── 彈窗內容 ──────────────────────────────────────────────
function makePopupContent(props, detail) {
  const level  = props.risk_level;
  const color  = riskColor(level);
  const scoreP = Math.round(props.risk_score * 100);

  const barFill = `background:${color}; width:${scoreP}%`;

  return `
    <div class="popup-card">
      <div class="popup-header">
        <div>
          <div class="popup-name">${props.station_name}</div>
          <div class="popup-sub">${props.county} ${props.town} ・ 海拔 ${Math.round(props.altitude||0)} m</div>
        </div>
        <span class="risk-badge badge-${level}">${props.risk_label}</span>
      </div>

      <div class="popup-metrics">
        <div class="metric-box">
          <div class="metric-val" style="color:${color}">${props.rain_1h.toFixed(1)}</div>
          <div class="metric-lbl">1h 雨量(mm)</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" style="color:${color}">${props.rain_24h.toFixed(1)}</div>
          <div class="metric-lbl">24h 雨量(mm)</div>
        </div>
        <div class="metric-box">
          <div class="metric-val" style="color:${color}">${props.rain_3days.toFixed(1)}</div>
          <div class="metric-lbl">3天 雨量(mm)</div>
        </div>
      </div>

      <div class="chart-title">未來 48h 降雨機率預報 (%)</div>
      <div class="chart-wrap">
        <canvas id="popupChart" height="110"></canvas>
      </div>

      <div class="popup-footer">
        <div class="score-bar-wrap">
          <span style="font-size:0.68rem">風險分數</span>
          <div class="score-bar"><div class="score-bar-fill" style="${barFill}"></div></div>
          <span style="font-size:0.7rem; color:${color}; font-weight:700">${scoreP}%</span>
        </div>
        <div class="care-badge">
          👥 ${detail ? detail.vulnerable.county_total : '?'} 人
        </div>
      </div>
    </div>`;
}

function renderPopupChart(forecast) {
  if (popupChart) { popupChart.destroy(); popupChart = null; }
  const canvas = document.getElementById('popupChart');
  if (!canvas || !forecast || forecast.length === 0) return;

  popupChart = new Chart(canvas.getContext('2d'), {
    type: 'line',
    data: {
      labels:   forecast.map(d => d.label),
      datasets: [{
        data:        forecast.map(d => d.pop),
        borderColor: '#38bdf8',
        backgroundColor: 'rgba(56,189,248,0.12)',
        borderWidth: 2,
        pointRadius: 2,
        tension: 0.4,
        fill: true,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      animation: { duration: 300 },
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.parsed.y}%` },
        backgroundColor: '#1e293b',
        titleColor: '#94a3b8',
        bodyColor: '#f1f5f9',
        borderColor: 'rgba(56,189,248,0.3)',
        borderWidth: 1,
      }},
      scales: {
        x: { ticks: { color: '#94a3b8', font: { size: 9 }, maxRotation: 45 }, grid: { color: 'rgba(255,255,255,0.04)' } },
        y: { min: 0, max: 100, ticks: { color: '#94a3b8', font: { size: 9 } }, grid: { color: 'rgba(255,255,255,0.06)' } },
      },
    },
  });
}

// ── 主要資料載入 ──────────────────────────────────────────
async function loadRiskMap() {
  const res  = await fetch(`${API_BASE}/api/risk-map`);
  const data = await res.json();

  // 更新 header 計數
  const meta = data.meta || {};
  const rc   = meta.risk_counts || {};
  document.getElementById('cnt-critical').textContent = rc.CRITICAL || 0;
  document.getElementById('cnt-high').textContent     = rc.HIGH     || 0;
  document.getElementById('cnt-medium').textContent   = rc.MEDIUM   || 0;

  // 繪製標記
  data.features.forEach(feat => {
    const props = feat.properties;
    const marker = makeCircleMarker(feat);

    // 點擊：開啟彈窗 + 載入詳情
    marker.on('click', async () => {
      const detailRes = await fetch(`${API_BASE}/api/community/${encodeURIComponent(props.station_id)}`);
      const detail    = await detailRes.json();

      const popup = L.popup({ maxWidth: 320, closeButton: true })
        .setContent(makePopupContent(props, detail));
      marker.bindPopup(popup).openPopup();

      // Chart.js 需要等 DOM 插入後才能 render
      setTimeout(() => renderPopupChart(detail.forecast_48h), 80);
    });

    // hover tooltip
    marker.bindTooltip(`<b>${props.station_name}</b><br/>${props.risk_label}`, {
      className: '',
      direction: 'top',
      offset: [0, -5],
    });

    marker.addTo(map);
  });
}

async function loadAlerts() {
  const res  = await fetch(`${API_BASE}/api/alerts`);
  const data = await res.json();
  const list = document.getElementById('alert-list');
  const cnt  = document.getElementById('sidebar-count');

  cnt.textContent = `共 ${data.total} 個告警測站`;

  if (data.total === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div>目前無高風險告警</div>`;
    return;
  }

  list.innerHTML = data.alerts.map(a => {
    const color = riskColor(a.risk_level);
    const scoreC = a.risk_level === 'CRITICAL' ? 'score-critical' : 'score-high';
    return `
      <div class="alert-item level-${a.risk_level}" onclick="flyTo(${a.lat},${a.lon})">
        <div class="alert-top">
          <div class="alert-name">${a.station_name}</div>
          <span class="alert-score ${scoreC}">${Math.round(a.risk_score*100)}%</span>
        </div>
        <div class="alert-meta">${a.county} ${a.town} ・ <span style="color:${color};font-weight:600">${a.risk_label}</span></div>
        <div class="alert-rain">24h ${a.rain_24h}mm ・ 3天 ${a.rain_3days}mm ・ 預報PoP ${a.forecast_pop_24h}%</div>
      </div>`;
  }).join('');
}

function flyTo(lat, lon) {
  map.flyTo([lat, lon], 13, { duration: 1 });
  // 手機關閉側邊欄
  if (window.innerWidth <= 768) closeSidebar();
}

// ── 手機側邊欄控制 ────────────────────────────────────────
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('visible');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('visible');
}

document.getElementById('fab-alert').addEventListener('click', openSidebar);
document.getElementById('overlay').addEventListener('click', closeSidebar);

// ── 初始化 ────────────────────────────────────────────────
(async function init() {
  initMap();
  try {
    await Promise.all([loadRiskMap(), loadAlerts()]);
  } catch (e) {
    console.error('載入失敗:', e);
    document.getElementById('alert-list').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div>無法連接 API<br/>請確認後端已啟動</div>`;
  }
  // 隱藏載入畫面
  const loading = document.getElementById('loading');
  loading.style.opacity = '0';
  setTimeout(() => loading.style.display = 'none', 400);
})();
</script>
</body>
</html>
