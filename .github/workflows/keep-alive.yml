name: Keep Render Awake

on:
  schedule:
    # 每一小時內的每 10 分鐘觸發一次，防止 Render 免費機台休眠
    - cron: "*/10 * * * *"
  workflow_dispatch: # 允許手動觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Healthz
        # 即使失敗也回傳 0 (成功)，避免 Github Actions 一直發出失敗警告信
        run: curl -sSf https://ecopredict-kpvw.onrender.com/healthz || exit 0
